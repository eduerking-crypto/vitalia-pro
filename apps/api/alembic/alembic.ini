[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when running the date / revision commands
timezone = utc

# max length of characters to apply in the version file
max_variable_name_length = 50

# version location
version_locations = alembic/versions

# version path separator
version_path_separator = os

# output directory for SQL scripts
sql_output_directory =

# the encoding used to generate files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The version table to use in the database
version_table = alembic_version

[post_write_hooks]
# post_write_hooks defines scripts or Python functions to run on newly generated
# revision scripts.  See the documentation for further details and examples

# format using "black" - use the console script
hooks = black

black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
