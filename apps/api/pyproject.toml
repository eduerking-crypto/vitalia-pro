[project]
name = "vitalia-api"
version = "0.1.0"
description = "VITALIA Pro — FastAPI backend (HealthTech, HIPAA/GDPR)"
requires-python = ">=3.12"

[project.dependencies]
fastapi = "0.115.0"
uvicorn = "0.34.0"
sqlalchemy = "2.0.36"
alembic = "1.15.0"
psycopg2-binary = "2.9.9"
asyncpg = "0.29.0"
pgvector = "0.3.2"
pydantic = "2.9.2"
pydantic-settings = "2.4.0"
passlib = "1.7.4"
argon2-cffi = "23.1.0"
python-jose = "3.3.0"
pyotp = "2.9.0"
slowapi = "0.1.9"
python-multipart = "0.0.9"
cryptography = "44.0.0"
celery = "5.4.0"
redis = "5.0.1"
langchain = "0.3.16"
langgraph = "0.2.37"
openai = "1.52.0"
httpx = "0.27.2"
email-validator = "2.2.0"

[project.optional-dependencies]
dev = [
    "pytest=8.3.3",
    "pytest-asyncio=0.24.0",
    "httpx=0.27.2",
    "ruff=0.9.0",
    "aiosqlite=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ", "PLC", "PD", "PERF", "RET", "RUF", "SIM", "TRY"]
